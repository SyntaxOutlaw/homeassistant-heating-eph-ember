boost_zone:
  name: Boost zone
  description: Boost an EPH zone for a number of hours.
  target:
    entity:
      domain: climate
      integration: eph_ember
  fields:
    hours:
      name: Hours
      description: Boost duration (1-3 hours).
      required: true
      selector:
        number:
          min: 1
          max: 3
          mode: box
    temperature:
      name: Temperature
      description: Optional boost target temperature in Celsius.
      selector:
        number:
          min: 5
          max: 35
          step: 0.5
          unit_of_measurement: "°C"
          mode: box

cancel_boost:
  name: Cancel boost
  description: Cancel an active boost on an EPH zone.
  target:
    entity:
      domain: climate
      integration: eph_ember
